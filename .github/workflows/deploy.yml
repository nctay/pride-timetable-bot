name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: python3 -m unittest -v

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          BOT_ENV: ${{ secrets.BOT_ENV }}
        run: |
          target="$DEPLOY_USER@$DEPLOY_HOST"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" pride_bot.py "$target:/opt/pride-timetable/pride_bot.py"
          printf '%s\n' "$BOT_ENV" | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$target" 'umask 077; cat > /opt/pride-timetable/.env'
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$target" 'python3 -m py_compile /opt/pride-timetable/pride_bot.py && sudo /usr/bin/systemctl restart pride-timetable.service && sleep 2 && sudo /usr/bin/systemctl is-active --quiet pride-timetable.service'
